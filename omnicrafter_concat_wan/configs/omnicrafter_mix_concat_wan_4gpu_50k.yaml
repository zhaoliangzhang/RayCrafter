# OmniCrafter backbone (Wan2.1-I2V-14B) from Wan's own weights + Pluecker channel concat only,
# perspective + panorama. The comparison for omnicrafter_scope_wan, on CIS.
# 4xH100, ZeRO-2 bf16, one set per GPU (global batch 4), 50k steps.
# No FrameCrafter weights: the r32 LoRA starts at zero and the patch embedding is Wan's 36 channels plus
# 384 zero ray channels (all trained), so step 0 is exactly Wan. No SCoPE and no scope-ff.
# Model / objective as omnicrafter_neardepth: per-frame VAE, neutral temporal RoPE, flow matching on
# the 3 query latents.
# Data / schedule as configs/flux3_mix_scope.yaml. Rays use FrameCrafter's gauge (last camera at the
# origin, unit mean camera distance), so near depth cancels; it only decides which scenes are kept.

wan_root: /cis/net/io95/data/dli/models/wan21
lora_rank: 32
lora_target_modules: q,k,v,o,ffn.0,ffn.2

sort_refs_by_distance: true

learning_rate: 1.0e-5
weight_decay: 0.01
warmup_steps: 500
max_steps: 50000
time_limit_hours: null
seed: 20261030

# Zhaoliang's near-depth tables, as committed for the near-depth run.
near_depth_json: /cis/home/dli90/RayCrafter-omnicrafter-concat-wan/omnicrafter_neardepth/near_depth/perspective.json
# Each query is fully black with probability nvs_ratio. The other queries draw
# an integer dropout percent from min..max, which stops at 75 so they keep points.
min_pixel_dropout: 0.0
max_pixel_dropout: 0.75
nvs_ratio: 0.5
train_shards: /cis/home/ayadav/wriva_runtimes_all/for_Zhaoliang/dl3dv_points/train
val_shards: /cis/home/ayadav/wriva_runtimes_all/for_Zhaoliang/dl3dv_points/test
image_size: [288, 512]
num_workers: 1

panorama_ratio: 0.5
panorama_root: /cis/net/io80/data/xliu253/framecrafter/5input_model
panorama_train_manifests:
  - manifests/hm3d_train_cleanup_q1.jsonl
  - manifests/jhu_holdout10_seed20260822/jhu_train_2ref1_excluding_10_scenes.jsonl
# 10 JHU scenes held out of training.
panorama_val_manifests:
  - manifests/jhu_holdout10_seed20260822/jhu_test_2ref1_10_scenes.jsonl
panorama_near_depth_json: /cis/home/dli90/RayCrafter-omnicrafter-concat-wan/omnicrafter_neardepth/near_depth/panorama.json
panorama_image_size: [256, 512]

# 10 dl3dv_points test + 10 JHU held-out sets, each as cleanup and NVS, at 3 timesteps.
val_sets: 10
val_t_indices: [250, 500, 750]

output_dir: /cis/net/io95/data/dli/raycrafter_runs/omnicrafter_mix_concat_wan_4gpu_50k
log_interval: 10
val_interval: 500
save_interval: 10000
resume_interval: 2000
use_wandb: true
wandb_project: raycrafter
wandb_run_name: omnicrafter_mix_concat_wan_4gpu_50k
