# OmniCrafter backbone (Wan2.1-I2V-14B) from Wan's own weights + plain SCoPE, perspective + panorama,
# with xliu253's task mix and LR start.
# 4xH100, ZeRO-2 bf16, one set per GPU (global batch 4), 50k steps.
# No FrameCrafter weights: the r32 LoRA starts at zero and the patch embedding is Wan's 36-channel one
# (trained), so step 0 is exactly Wan. No Pluecker concat and no scope-ff.
# Model / objective as omnicrafter_neardepth: per-frame VAE, neutral temporal RoPE, flow matching on
# the 3 query latents.
# Task mix and LR start as xliu253's mixed recipe (omnicrafter_handoff/docs/EXPERIMENTS.md): NVS per set
# (all three queries black together, p 0.5), cleanup dropout 0-100%, ConstantLR start without warmup.
# Everything else as omnicrafter_mix_scope_wan_4gpu_50k.yaml.
# Camera / data / schedule as configs/flux3_mix_scope.yaml: SCoPE is the only camera module (released
# recipe: 7→64→dim MLP, plucker_eps 1e-3, log-scale gate shift, no V residual); poses are anchored on
# the nearest ref; translations are in near-depth units for both kinds.

wan_root: /weka/projects/rchella4/zzhan288/FrameCrafter/models
lora_rank: 32
lora_target_modules: q,k,v,o,ffn.0,ffn.2

scope_mlp_hidden: 64
sort_refs_by_distance: true

learning_rate: 1.0e-5
weight_decay: 0.01
warmup_steps: 0
# 1/3 of the LR for optimizer steps 1-2 on 4 GPUs, then 1e-5 (train.lr_lambda).
lr_schedule: constant_lr
max_steps: 50000
time_limit_hours: 71.5
seed: 20261030

# Same files as the flux3 mix runs, through the paths dli90 can read.
near_depth_json: /weka/projects/rchella4/zzhan288/data/dl3dv_points/near_depth.json
# Each set is NVS with probability nvs_probability: all three queries black. Otherwise every query
# draws its own integer dropout percent from min..max, through 100%, so a cleanup query can be black too.
min_pixel_dropout: 0.0
max_pixel_dropout: 1.0
nvs_ratio: 0.0
nvs_probability: 0.5
train_shards: /weka/projects/rchella4/zzhan288/data/dl3dv_points/train
val_shards: /weka/projects/rchella4/zzhan288/data/dl3dv_points/test
image_size: [288, 512]
num_workers: 1

panorama_ratio: 0.5
panorama_root: /weka/projects/rchella4/zzhan288/data/framecrafter_5input
panorama_train_manifests:
  - manifests/hm3d_train_cleanup_q1.jsonl
  - manifests/jhu_holdout10_seed20260822/jhu_train_2ref1_excluding_10_scenes.jsonl
# 10 JHU scenes held out of training.
panorama_val_manifests:
  - manifests/jhu_holdout10_seed20260822/jhu_test_2ref1_10_scenes.jsonl
panorama_near_depth_json: /weka/projects/rchella4/zzhan288/data/framecrafter_5input/near_depth.json
panorama_image_size: [256, 512]

# 10 dl3dv_points test + 10 JHU held-out sets, each as cleanup and NVS, at 3 timesteps.
val_sets: 10
val_t_indices: [250, 500, 750]

output_dir: /weka/projects/rchella4/dli90/omnicrafter_outputs/omnicrafter_mix_scope_wan_xliutasks_4gpu_50k
log_interval: 10
val_interval: 500
save_interval: 10000
resume_interval: 2000
use_wandb: true
wandb_project: raycrafter
wandb_run_name: omnicrafter_mix_scope_wan_xliutasks_4gpu_50k
